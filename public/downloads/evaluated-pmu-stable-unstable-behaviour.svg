<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Stable and unstable prediction behaviour obtained from the evaluated PMU event</title>
  <desc id="desc">Across observation windows from 100 to 500 milliseconds, unstable probability rises from 0.571 to 0.593 while stable probability falls from 0.429 to 0.407. Neither reaches the 0.65 decision threshold.</desc>
  <rect width="1000" height="620" fill="#fff"/><text x="500" y="34" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#0f172a">Stable and Unstable Prediction Behaviour</text><text x="500" y="57" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">Evaluated PMU event · disturbance onset 20,380 ms</text>
  <g stroke="#e2e8f0"><path d="M100 90H950M100 180H950M100 270H950M100 360H950M100 450H950M100 540H950"/></g>
  <line x1="100" y1="247.5" x2="950" y2="247.5" stroke="#b45309" stroke-width="2" stroke-dasharray="7 6"/><text x="940" y="238" text-anchor="end" font-family="Arial" font-size="12" fill="#92400e">Decision threshold = 0.65</text>
  <polyline points="150,346.9 390,354.5 630,356.9 900,356.9" fill="none" stroke="#15803d" stroke-width="4"/><polyline points="150,283.1 390,275.5 630,273.2 900,273.2" fill="none" stroke="#dc2626" stroke-width="4"/>
  <g fill="#15803d"><circle cx="150" cy="346.9" r="6"/><circle cx="390" cy="354.5" r="6"/><circle cx="630" cy="356.9" r="6"/><circle cx="900" cy="356.9" r="6"/></g><g fill="#dc2626"><circle cx="150" cy="283.1" r="6"/><circle cx="390" cy="275.5" r="6"/><circle cx="630" cy="273.2" r="6"/><circle cx="900" cy="273.2" r="6"/></g>
  <g font-family="Arial" font-size="12" fill="#475569"><text x="86" y="94" text-anchor="end">1.0</text><text x="86" y="184" text-anchor="end">0.8</text><text x="86" y="274" text-anchor="end">0.6</text><text x="86" y="364" text-anchor="end">0.4</text><text x="86" y="454" text-anchor="end">0.2</text><text x="86" y="544" text-anchor="end">0.0</text><text x="150" y="562" text-anchor="middle">100</text><text x="390" y="562" text-anchor="middle">200</text><text x="630" y="562" text-anchor="middle">300</text><text x="900" y="562" text-anchor="middle">500</text></g>
  <path d="M100 90V540H950" fill="none" stroke="#64748b" stroke-width="1.5"/><text x="525" y="600" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#0f172a">Observation window (ms)</text><text transform="translate(28 315) rotate(-90)" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#0f172a">Prediction probability</text>
  <g font-family="Arial" font-size="13" fill="#0f172a"><line x1="650" y1="106" x2="686" y2="106" stroke="#dc2626" stroke-width="4"/><text x="696" y="111">Unstable probability</text><line x1="650" y1="132" x2="686" y2="132" stroke="#15803d" stroke-width="4"/><text x="696" y="137">Stable probability</text></g>
  <rect x="385" y="178" width="280" height="34" rx="5" fill="#fef3c7" stroke="#d97706"/><text x="525" y="200" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#78350f">All evaluated windows: UNCERTAIN</text>
</svg>
